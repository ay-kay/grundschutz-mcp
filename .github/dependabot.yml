version: 2
updates:
  # Python deps
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Docker base image
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
