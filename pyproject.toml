[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grundschutz-mcp"
version = "0.1.0"
description = "MCP server providing structured access to the BSI IT-Grundschutz-Kompendium"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["mcp", "bsi", "it-grundschutz", "isms", "rag", "embeddings"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "structlog>=24.0",
    "openpyxl>=3.1",   # KRT XLSX parsing
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
server = [
    "mcp[cli]>=1.0",
    "uvicorn>=0.30",
    "starlette>=0.40",
]
embeddings = [
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear (common pitfalls)
    "UP",       # pyupgrade (use modern syntax)
]
# Allow long lines in comments and strings; the formatter handles code lines.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests rely on assert and may have long fixture lines.
# F811: cross-test fixture sharing via `from .other_test import fixture`
#       is the documented pytest pattern.
# E402: same pattern - the fixture import has to come AFTER the constants
#       it depends on in some files.
"tests/*" = ["B011", "E402", "F811"]

